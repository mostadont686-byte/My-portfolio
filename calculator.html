<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Мой калькулятор</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #10172a;

      font-family: Arial, sans-serif;

      color: white;

    }

    .calculator {

      width: 320px;

      padding: 22px;

      border-radius: 20px;

      background: #1c2740;

      box-shadow: 0 15px 40px #0006;

    }

    h1 {

      text-align: center;

      font-size: 24px;

    }

    #display {

      width: 100%;

      height: 65px;

      margin-bottom: 15px;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: #0b1020;

      color: white;

      text-align: right;

      font-size: 28px;

    }

    .buttons {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 9px;

    }

    button {

      height: 58px;

      border: none;

      border-radius: 10px;

      background: #344361;

      color: white;

      font-size: 21px;

      cursor: pointer;

    }

    button:hover {

      background: #52658c;

    }

    .operator {

      background: #6657cf;

    }

    .equal {

      background: #25a995;

    }

    .clear {

      background: #d65362;

    }

  </style>

</head>

<body>

  <div class="calculator">

    <h1>Мой калькулятор</h1>

    <input id="display" type="text" value="0" readonly>

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">C</button>

      <button onclick="deleteLast()">⌫</button>

      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="addNumber('7')">7</button>

      <button onclick="addNumber('8')">8</button>

      <button onclick="addNumber('9')">9</button>

      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="addNumber('4')">4</button>

      <button onclick="addNumber('5')">5</button>

      <button onclick="addNumber('6')">6</button>

      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button onclick="addNumber('1')">1</button>

      <button onclick="addNumber('2')">2</button>

      <button onclick="addNumber('3')">3</button>

      <button class="equal" onclick="calculate()" style="grid-row: span 2; height: 125px;">=</button>

      <button onclick="addNumber('0')" style="grid-column: span 2;">0</button>

      <button onclick="addNumber('.')">.</button>

    </div>

  </div>

  <script>

    const display = document.getElementById("display");

    let firstNumber = null;

    let operator = null;

    let waitingForSecondNumber = false;

    function addNumber(number) {

      if (waitingForSecondNumber) {

        display.value = number === "." ? "0." : number;

        waitingForSecondNumber = false;

        return;

      }

      if (number === "." && display.value.includes(".")) return;

      if (display.value === "0" && number !== ".") {

        display.value = number;

      } else {

        display.value += number;

      }

    }

    function chooseOperator(selectedOperator) {

      firstNumber = Number(display.value);

      operator = selectedOperator;

      waitingForSecondNumber = true;

    }

    function calculate() {

      if (operator === null || waitingForSecondNumber) return;

      const secondNumber = Number(display.value);

      let result;

      switch (operator) {

        case "+":

          result = firstNumber + secondNumber;

          break;

        case "-":

          result = firstNumber - secondNumber;

          break;

        case "*":

          result = firstNumber * secondNumber;

          break;

        case "/":

          if (secondNumber === 0) {

            display.value = "Ошибка";

            operator = null;

            return;

          }

          result = firstNumber / secondNumber;

          break;

      }

      display.value = String(Number(result.toFixed(10)));

      operator = null;

      waitingForSecondNumber = true;

    }

    function clearDisplay() {

      display.value = "0";

      firstNumber = null;

      operator = null;

      waitingForSecondNumber = false;

    }

    function deleteLast() {

      if (waitingForSecondNumber) return;

      display.value = display.value.length > 1

        ? display.value.slice(0, -1)

        : "0";

    }

  </script>

</body>

</html>
